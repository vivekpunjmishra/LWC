<template>
    <lightning-card title="Record Edite Form ">
        <lightning-record-edit-form object-api-name={ObjectApiName} record-id={recordId}
                                    onsuccess={handleSuccess}
                                    density="compact">
            <lightning-input-field field-name="Id" value={playerId}></lightning-input-field> 
            <lightning-input-field field-name={nameField}></lightning-input-field>
            <lightning-input-field field-name={goalsField}></lightning-input-field> 
            <lightning-input-field field-name={footballClubField}></lightning-input-field> 
        <lightning-button label="Submit" variant="brand" type="submit"></lightning-button>                           
        </lightning-record-edit-form>
    </lightning-card>
</template>
